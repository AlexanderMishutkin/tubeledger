<!doctype html>
<!-- Dev harness for the on-page corner indicator. Renders content.js against a
     stubbed chrome.* and a faked <video>, over a YouTube-ish backdrop.
       npm run preview  ->  http://localhost:8777/test/preview-hud.html?mode=work
     modes: work | ent | ent-toast | menu | blocked
     add &theme=light, &stale=1, &nomasthead=1, or &fs=1 (fakes fullscreen by
     stubbing document.fullscreenElement, which is what the script reads) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TubeLedger — corner preview</title>
  <style>
    body { margin: 0; background: #0f0f0f; color: #f1f1f1;
           font: 14px/1.5 Roboto, system-ui, sans-serif; }
    html:not([dark]) body { background: #fff; color: #0f0f0f; }
    ytd-masthead { display: block; position: sticky; top: 0; z-index: 20;
                   background: inherit; border-bottom: 1px solid #272727; }
    html:not([dark]) ytd-masthead { border-bottom-color: #e5e5e5; }
    ytd-masthead #container { height: 56px; display: flex; align-items: center;
                              padding: 0 16px; gap: 16px; }
    ytd-masthead #center { flex: 1; max-width: 500px; }
    ytd-masthead #end { margin-left: auto; }
    ytd-masthead #buttons { display: flex; align-items: center; gap: 8px; }
    .yt-btn { height: 36px; border-radius: 999px; padding: 0 14px; display: flex;
              align-items: center; background: #272727; font-size: 13px; font-weight: 500; }
    html:not([dark]) .yt-btn { background: #f2f2f2; }
    .yt-icon { width: 36px; height: 36px; border-radius: 50%; background: #272727; }
    html:not([dark]) .yt-icon { background: #f2f2f2; }
    .chips { display: flex; gap: 10px; padding: 12px 24px; }
    .chip { background: #272727; border-radius: 8px; padding: 6px 14px; font-size: 13px; }
    html:not([dark]) .chip { background: #f2f2f2; }
    .logo { font-weight: 700; letter-spacing: -.5px; }
    .search { height: 34px; border: 1px solid #303030; border-radius: 999px; background: #121212; }
    html:not([dark]) .search { border-color: #ccc; background: #fff; }
    .page { padding: 24px; display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    .player { aspect-ratio: 16/9; background: linear-gradient(135deg, #1f1f24, #34343c);
              border-radius: 12px; display: flex; align-items: center;
              justify-content: center; color: #6b6b72; }
    .side > div { height: 86px; background: #1c1c1c; border-radius: 10px; margin-bottom: 12px; }
    .state { position: fixed; left: 16px; bottom: 16px; color: #8a8a85; font-size: 12px; }
  </style>
</head>
<body>
  <ytd-masthead id="masthead">
    <div id="container">
      <div id="start"><span class="logo">YouTube</span></div>
      <div id="center"><div class="search"></div></div>
      <div id="end">
        <div id="buttons">
          <span class="yt-btn">+ Create</span>
          <span class="yt-icon"></span>
          <span class="yt-icon"></span>
        </div>
      </div>
    </div>
  </ytd-masthead>
  <div class="chips">
    <span class="chip">All</span><span class="chip">Gaming</span>
    <span class="chip">Role-Playing Games</span><span class="chip">Simulation video games</span>
  </div>
  <div class="page">
    <div class="player">(player)</div>
    <div class="side"><div></div><div></div><div></div><div></div></div>
  </div>
  <div class="state" id="state"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') || 'work';
    if (params.get('theme') !== 'light') document.documentElement.setAttribute('dark', '');
    if (params.get('nomasthead')) document.querySelector('ytd-masthead').remove();

    // Fullscreen, without needing a user gesture: the masthead stays in the DOM
    // exactly as YouTube leaves it, and document.fullscreenElement is what the
    // content script actually reads to decide where the pill goes.
    if (params.get('fs')) {
      const stage = document.createElement('div');
      stage.id = 'fake-fullscreen';
      stage.style.cssText = 'position:fixed;inset:0;z-index:50;background:'
        + 'radial-gradient(circle at 42% 45%, #2b3346 0%, #0a0a0c 78%);'
        + 'display:flex;align-items:center;justify-content:center;color:#5a5a66;font-size:13px';
      stage.textContent = '(video, fullscreen)';
      document.body.appendChild(stage);
      Object.defineProperty(document, 'fullscreenElement', { get: () => stage, configurable: true });
      document.dispatchEvent(new Event('fullscreenchange'));
    }
    document.getElementById('state').textContent = `preview mode: ${mode}`;

    // A <video> the content script will read as playing (or not).
    const video = document.createElement('video');
    const playing = mode !== 'menu';
    Object.defineProperty(video, 'paused', { get: () => !playing });
    Object.defineProperty(video, 'ended', { get: () => false });
    Object.defineProperty(video, 'readyState', { get: () => 4 });
    Object.defineProperty(video, 'muted', { get: () => false });
    Object.defineProperty(video, 'volume', { get: () => 1 });
    video.pause = () => {};
    document.querySelector('.player').appendChild(video);

    const inbound = [];
    window.chrome = {
      runtime: {
        connect() {
          return {
            postMessage() {},
            disconnect() {},
            onMessage: { addListener: (fn) => inbound.push(fn) },
            onDisconnect: { addListener() {} },
          };
        },
        sendMessage(msg, cb) { if (cb) cb(true); },
      },
    };

    const m = (x) => x * 60000;
    const limit = {
      type: 'limit',
      blocked: mode === 'blocked',
      category: mode === 'work' ? 'work' : 'ent',
      usedMs: mode === 'blocked' ? m(60) : m(15),
      limitMs: m(60),
      blockEnabled: true,
      hudEnabled: true,
      // Omitted unless asked for: no version means "nothing to compare against".
      build: params.get('stale') ? '9.9.9' : undefined,
    };
    const push = (msg) => { for (const fn of inbound) fn(msg); };

    const s = document.createElement('script');
    s.src = '../src/content.js';
    s.onload = () => {
      setTimeout(() => {
        push(limit);
        if (mode === 'ent-toast') setTimeout(() => push({ type: 'remind', remainingMs: m(45) }), 250);
      }, 100);
    };
    document.body.appendChild(s);
  </script>
</body>
</html>
